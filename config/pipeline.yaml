# Pipeline configuration for the Sparkov credit card fraud dataset.
# All paths are relative to the project root.

dataset:
  kaggle_slug: kartik2112/fraud-detection
  files:
    train: fraudTrain.csv
    test: fraudTest.csv

paths:
  raw: data/raw          # bronze: untouched source files + manifest
  silver: data/silver    # cleaned, typed, PII-reduced transactions
  gold: data/gold        # model-ready feature tables + dashboard table
  reports: reports       # validation and profiling reports
  figures: reports/figures      # EDA charts (Step 3)
  processed: data/processed     # model-ready matrices (Step 3)
  artifacts: artifacts          # fitted preprocessors (Step 3)

split:
  # Kaggle's fraudTest.csv already continues fraudTrain.csv in time.
  # We carve the last N weeks of fraudTrain.csv out as a validation set.
  validation_weeks: 6

features:
  # Rolling per-card windows (label: seconds). Only PRIOR transactions count.
  velocity_windows:
    1h: 3600
    24h: 86400
    7d: 604800
  night_hours: [22, 23, 0, 1, 2, 3]

privacy:
  # Direct identifiers removed in the silver layer.
  drop_columns: [first, last, street]
  # cc_num is replaced by a salted SHA-256 card_id.
  # Set the salt via this environment variable; a default is used otherwise.
  hash_salt_env: CARD_HASH_SALT

storage:
  format: parquet        # falls back to csv if pyarrow is not installed

# ---------------- Step 3: cleaning audit, EDA, preprocessing ----------------
eda:
  sample_rows: 300000      # rows sampled for correlation / signal ranking
  min_state_txns: 5000     # ignore states with fewer training transactions
  corr_threshold: 0.85     # flag feature pairs above this |Spearman rho|
  near_duplicate_seconds: 60

preprocess:
  winsor_quantiles: [0.001, 0.999]   # clipping for scale-sensitive models only
  save_matrices: true
  # Left out of the model matrices. Running totals only ever grow, so later
  # periods contain values never seen in training. Review
  # reports/preprocessing_report.json -> validation_drift_psi before adding more.
  exclude_features:
    - card_prior_txn_count
    - card_prior_category_count
    - distance_km
    - is_new_merchant_for_card
