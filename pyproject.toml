[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens"
version = "2.0.0"
description = "FraudLens: an anomaly detection framework for fraudulent credit card transactions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "pyarrow>=15", "pyyaml>=6", "joblib>=1.3",
  "matplotlib>=3.8", "seaborn>=0.13", "plotly>=5.24,<6",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "lightgbm>=4.0", "shap>=0.46", "mlflow>=2.17", "evidently>=0.7,<0.8"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20", "streamlit>=1.40"]
platform = ["boto3>=1.34", "minio>=7.2.15", "trino>=0.330", "requests>=2.31"]
data = ["kaggle>=1.6"]
dev = ["pytest>=8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
