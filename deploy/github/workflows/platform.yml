# The open-source data platform, end to end on a GitHub runner:
# NiFi ingest -> MinIO lake -> Hive Metastore crawler -> Trino (+ governance) -> ClickHouse,
# MLflow tracking server, FastAPI scoring API, Prometheus, Grafana and Superset.
name: platform

on:
  push:
    branches: [main, final-a4]
    paths:
      - "platform/**"
      - "src/**"
      - "config/**"
      - "scripts/ci/**"
      - "requirements.lock.txt"
      - ".github/workflows/platform.yml"
  workflow_dispatch:

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: platform end to end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
      PROFILES: --profile lake --profile ingest --profile olap --profile mlops --profile bi
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install
        run: pip install -c requirements.lock.txt -e ".[ml,serve,platform,dev]"
      - name: Configure the platform (throw-away CI credentials from .env.example)
        run: |
          cp platform/.env.example platform/.env
          grep -E '^[A-Z_]+=' platform/.env >> "$GITHUB_ENV"
          mkdir -p data/landing && chmod 777 data/landing
      - name: Build images
        working-directory: platform
        run: docker compose $PROFILES build
      - name: Start lake, ingest, OLAP and MLflow
        working-directory: platform
        run: docker compose $PROFILES up -d minio minio-init postgres hive-metastore trino nifi nifi-init clickhouse mlflow
      - name: Wait for the services
        run: python scripts/ci/wait_for.py minio minio-init trino clickhouse mlflow nifi-init --timeout 900
      - name: Run the lifecycle on sample data (NiFi -> lake -> models -> catalog -> ClickHouse)
        run: python scripts/ci/run_sample_pipeline.py --ingest nifi --cards 300
      - name: Start serving, monitoring and BI
        working-directory: platform
        run: docker compose $PROFILES up -d api prometheus grafana superset
      - name: Wait for serving and BI
        run: python scripts/ci/wait_for.py api prometheus grafana superset --timeout 600
      - name: Smoke test every component
        run: python scripts/ci/smoke_platform.py
      - name: Collect service logs
        if: always()
        working-directory: platform
        run: |
          docker compose $PROFILES ps -a
          mkdir -p ../reports/platform-logs
          for s in $(docker compose $PROFILES config --services); do
            docker compose $PROFILES logs --no-color "$s" > "../reports/platform-logs/$s.log" 2>&1 || true
          done
          docker stats --no-stream || true
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-reports
          path: |
            reports/*.json
            reports/olap/
            reports/figures/20_olap_benchmark.png
            reports/platform-logs/
          if-no-files-found: ignore

  governance:
    name: governance (OpenMetadata catalog, PII tags, lineage)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILES: --profile lake
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install
        run: pip install -c requirements.lock.txt -e ".[ml,serve,platform,dev]"
      - name: Configure the platform
        run: |
          cp platform/.env.example platform/.env
          grep -E '^[A-Z_]+=' platform/.env >> "$GITHUB_ENV"
      - name: Start the lake (MinIO, Hive Metastore, Trino)
        working-directory: platform
        run: docker compose $PROFILES up -d --build minio minio-init postgres hive-metastore trino
      - name: Start OpenMetadata (pulls in the background while the pipeline runs)
        run: docker compose -f platform/openmetadata/docker-compose.yml up -d
      - name: Wait for the lake
        run: python scripts/ci/wait_for.py minio minio-init trino --timeout 900
      - name: Run the lifecycle on sample data through the crawler
        run: python scripts/ci/run_sample_pipeline.py --ingest direct --cards 200 --stop crawl
      - name: Catalog, classify and trace lineage in OpenMetadata
        run: python platform/openmetadata/govern.py --ingest docker
      - name: Governance summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          r = json.load(open("reports/governance_catalog.json"))
          print(f"## OpenMetadata {r['openmetadata_version']}: {len(r['tables'])} tables, {r['pii_columns']} PII-tagged columns\n")
          print("**Lineage into gold.scored_transactions:** " + ", ".join(r["scored_transactions_upstream"]) + "\n")
          for t in r["tables"]:
              print(f"- `{t['fqn']}` ({t['columns']} columns) PII: {', '.join(t['pii']) or '-'}")
          PY
      - name: Collect logs
        if: always()
        run: |
          mkdir -p reports/platform-logs
          docker compose -f platform/openmetadata/docker-compose.yml logs --no-color --tail 300 > reports/platform-logs/openmetadata.log 2>&1 || true
          (cd platform && docker compose $PROFILES logs --no-color --tail 300 > ../reports/platform-logs/lake.log 2>&1) || true
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports
          path: |
            reports/governance_catalog.json
            reports/data_catalog.json
            reports/platform-logs/
          if-no-files-found: ignore
