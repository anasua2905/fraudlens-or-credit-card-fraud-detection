# Deployment: build the application image (champion model + scoring API + dashboard),
# smoke-test it, and publish it to the GitHub Container Registry.
name: deploy

on:
  push:
    branches: [main, final-a4]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build, test and publish fraudlens-app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/fraudlens-app" >> "$GITHUB_OUTPUT"
          echo "ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/docker/Dockerfile.app
          load: true
          tags: fraudlens-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the API and the dashboard containers
        run: |
          docker run -d --name api -p 8000:8000 fraudlens-app:test api
          docker run -d --name dash -p 8501:8501 fraudlens-app:test dashboard
          for i in $(seq 1 40); do curl -fsS localhost:8000/health && break; sleep 3; done
          txn=$(curl -fsS localhost:8000/openapi.json | python -c "import json,sys;print(json.dumps(json.load(sys.stdin)['components']['schemas']['Transaction']['examples'][0]))")
          curl -fsS -X POST "localhost:8000/score?update_state=false" -H 'content-type: application/json' -d "$txn" | tee score.json
          python -c "import json;r=json.load(open('score.json'));assert 0<=r['score']<=1;print('score ok', r['score'], r['alert'])"
          for i in $(seq 1 40); do curl -fsS localhost:8501/_stcore/health && break; sleep 3; done
          curl -fsS localhost:8501/ | grep -qi streamlit
          docker logs api | tail -20; docker logs dash | tail -20
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/docker/Dockerfile.app
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=FraudLens credit card fraud detection: scoring API and dashboard
          cache-from: type=gha
