# FraudLens open-source data platform.
#
# AWS service            -> open-source stand-in used here                 profile / service
#   S3 (storage)          -> MinIO (S3-compatible object store)              lake / minio
#   Glue crawler          -> Apache NiFi (ingest) + Python lake crawler      ingest / nifi; fraudlens.crawler
#   Glue Data Catalog     -> Hive Metastore (+ PostgreSQL)                   lake / hive-metastore
#   Lake Formation        -> Trino access control + MinIO policies;          lake / trino, minio-init
#                            OpenMetadata (catalog, PII tags, lineage)       governance (compose.governance.yml)
#   Redshift Spectrum     -> Trino (SQL over Parquet in the lake)            lake / trino
#   Redshift              -> ClickHouse (columnar OLAP over the gold layer)  olap / clickhouse
#   QuickSight            -> Apache Superset (BI) and Grafana (ops)          bi / superset; mlops / grafana
#   SageMaker endpoints   -> FastAPI scoring API                             mlops / api
#   CloudWatch            -> Prometheus + Grafana                            mlops / prometheus, grafana
#   SageMaker Experiments -> MLflow tracking server + registry               mlops / mlflow
#
# Start in layers (16 GB RAM laptop friendly):
#   docker compose --profile lake up -d                    # MinIO, Postgres, Hive Metastore, Trino
#   docker compose --profile lake --profile ingest up -d   # + Apache NiFi and its flow
#   docker compose --profile lake --profile olap up -d     # + ClickHouse
#   docker compose --profile lake --profile bi up -d       # + Superset
#   docker compose --profile mlops up -d                   # MLflow, scoring API, Prometheus, Grafana
#
# Copy .env.example to .env first and change the passwords.
name: fraudlens

x-py: &py
  build:
    context: ..
    dockerfile: platform/docker/Dockerfile.python
  image: fraudlens-py:2.0
  env_file: .env

services:
  # ------------------------------------------------------------------ lake
  minio:
    # MinIO stopped publishing community images to Docker Hub in 2026; Chainguard's
    # build of the same open-source server is used instead.
    image: cgr.dev/chainguard/minio:latest
    profiles: [lake]
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 10s
      retries: 5

  minio-init:
    <<: *py
    profiles: [lake]
    command: ["python", "platform/minio/init_minio.py"]
    environment:
      MINIO_ENDPOINT: minio:9000
    depends_on:
      minio: {condition: service_started}
    restart: "no"

  postgres:
    image: postgres:16-alpine
    profiles: [lake]
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: metastore_db
    volumes: [postgres-data:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      retries: 10

  hive-metastore:
    build: ./hive
    image: fraudlens-hive-metastore:4.0.1
    profiles: [lake]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Xmx768m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["9083:9083"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1g

  trino:
    image: trinodb/trino:483
    profiles: [lake]
    ports: ["8080:8080"]
    environment:
      S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY}
    volumes:
      - ./trino/etc/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
      - ./trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/etc/rules.json:/etc/trino/rules.json:ro
    depends_on: [hive-metastore, minio]
    mem_limit: 3g      # JVM heap = 80% of this

  # ------------------------------------------------------------------ ingest
  nifi:
    # Apache NiFi: picks up files dropped in data/landing and writes them to the raw
    # layer with an ingest record each (flow built by platform/nifi/build_flow.py).
    image: apache/nifi:2.12.0
    profiles: [ingest]
    hostname: nifi
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}    # at least 12 characters
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_PROXY_HOST: localhost:8443,127.0.0.1:8443,nifi:8443
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    ports: ["8443:8443"]
    volumes:
      - ../data/landing:/landing:ro
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-conf:/opt/nifi/nifi-current/conf
    mem_limit: 2g

  nifi-init:
    <<: *py
    profiles: [ingest]
    command: ["python", "platform/nifi/build_flow.py"]
    environment:
      NIFI_URL: https://nifi:8443
      NIFI_S3_ENDPOINT: http://minio:9000
      NIFI_LANDING_DIR: /landing
    depends_on: [nifi]
    restart: "no"

  # ------------------------------------------------------------------ OLAP
  clickhouse:
    # Columnar analytics database for the gold layer (loaded by `python -m fraudlens.olap`).
    image: clickhouse/clickhouse-server:26.3
    profiles: [olap]
    environment:
      FRAUDLENS_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ANALYST_ACCESS_KEY: ${ANALYST_ACCESS_KEY}
      ANALYST_SECRET_KEY: ${ANALYST_SECRET_KEY}
    ports: ["8123:8123"]
    volumes:
      - ./clickhouse/config.d/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - ./clickhouse/users.d/fraudlens.xml:/etc/clickhouse-server/users.d/fraudlens.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      retries: 10

  # ------------------------------------------------------------------ BI
  superset:
    build: ./superset
    image: fraudlens-superset:4.1.2
    profiles: [bi]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      TRINO_URI: trino://superset@trino:8080/hive
    ports: ["8088:8088"]
    volumes: [superset-home:/app/superset_home]
    depends_on: [trino]
    mem_limit: 2g

  # ------------------------------------------------------------------ MLOps
  mlflow:
    <<: *py
    profiles: [mlops]
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "*"
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    mem_limit: 1g

  api:
    <<: *py
    profiles: [mlops]
    command: ["uvicorn", "fraudlens.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FRAUDLENS_MODEL_DIR: /app/dashboard/bundle
      FRAUDLENS_FEEDBACK_FILE: /feedback/feedback.csv
    ports: ["8000:8000"]
    restart: unless-stopped        # waits for the model bundle if the pipeline has not produced it yet
    volumes:
      - ../dashboard/bundle:/app/dashboard/bundle:ro
      - feedback:/feedback
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: [mlops]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [api]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [mlops]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    mem_limit: 512m

volumes:
  minio-data:
  nifi-state:
  nifi-conf:
  clickhouse-data:
  postgres-data:
  superset-home:
  mlflow-data:
  feedback:
  prometheus-data:
  grafana-data:
