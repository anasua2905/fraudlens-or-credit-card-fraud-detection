# FraudLens work breakdown, used by scripts/github/setup_project.py to create the GitHub
# labels, milestones, issues and Project board. status: done | in_progress | todo

milestones:
  - title: "M1 · Data foundation (stages 1-3)"
    description: "Problem framing, acquisition with metadata, preparation into a governed lake"
  - title: "M2 · Analysis & modelling (stages 4-6)"
    description: "EDA, model development and selection, evaluation and interpretation"
  - title: "M3 · Deployment & monitoring (stages 7-8)"
    description: "API, dashboard, platform, monitoring and the improvement loop"
  - title: "M4 · Final submission"
    description: "Report, presentation, demo and repository hand-in"

stages:   # options of the Project's "Lifecycle stage" field and the stage labels
  - {key: "1-problem", name: "1 Problem understanding", color: GRAY}
  - {key: "2-acquisition", name: "2 Data acquisition", color: BLUE}
  - {key: "3-preparation", name: "3 Data preparation", color: BLUE}
  - {key: "4-eda", name: "4 EDA", color: GREEN}
  - {key: "5-modelling", name: "5 Modelling", color: GREEN}
  - {key: "6-evaluation", name: "6 Evaluation & interpretation", color: GREEN}
  - {key: "7-deployment", name: "7 Deployment & visualisation", color: ORANGE}
  - {key: "8-monitoring", name: "8 Monitoring & improvement", color: ORANGE}
  - {key: "platform", name: "Data platform", color: PURPLE}
  - {key: "deliverable", name: "Deliverables", color: PINK}

labels:
  - {name: "type: feature", color: "1d76db", description: "New capability"}
  - {name: "type: bug", color: "d73a4a", description: "Something is wrong"}
  - {name: "type: docs", color: "0075ca", description: "Documentation"}
  - {name: "type: infra", color: "5319e7", description: "Platform, CI/CD, deployment"}
  - {name: "type: analysis", color: "0e8a16", description: "Analysis, experiments, evaluation"}
  - {name: "priority: high", color: "b60205", description: ""}
  - {name: "priority: medium", color: "fbca04", description: ""}

issues:
  # ---------------- M1
  - title: "Define the problem, users and success criteria"
    stage: 1-problem
    milestone: 1
    type: docs
    status: done
    body: |
      Frame fraud detection as ranking + a cost-based alert rule; agree measurable success criteria.
      - [x] Problem statement and stakeholders (`docs/problem_statement.md`, notebook 01)
      - [x] Success criteria in `config/pipeline.yaml` (recall >= 0.90, precision >= 0.50, <= 20 alerts/day, PR-AUC lift >= 50)
      - [x] Cost model ($15 per review, 90% recovery)
  - title: "Acquire the Sparkov dataset with checksums and metadata"
    stage: 2-acquisition
    milestone: 1
    type: feature
    status: done
    body: |
      - [x] Kaggle API and local-copy acquisition (`src/fraudlens/acquire.py`)
      - [x] Manifest with SHA-256, sizes, row counts; column profile
      - [x] Provenance collected from the web with requests + BeautifulSoup (notebook 02)
  - title: "Ingest raw files into the lake with Apache NiFi"
    stage: platform
    milestone: 1
    type: infra
    status: done
    body: |
      - [x] NiFi flow built through the REST API (`platform/nifi/build_flow.py`)
      - [x] Write-only ingest account; versioned raw bucket
      - [x] Ingest record per file; acquisition waits for NiFi (`--ingest nifi`)
  - title: "Data contract, cleaning and the silver layer"
    stage: 3-preparation
    milestone: 1
    type: feature
    status: done
    body: |
      - [x] Validation report; cleaning audit with decisions
      - [x] PII removed, card numbers pseudonymised
      - [x] Leakage-safe features and chronological split; Dask scale-out check (notebook 03)
  - title: "Publish silver/gold to MinIO and register tables in the Hive Metastore"
    stage: platform
    milestone: 1
    type: infra
    status: done
    body: |
      - [x] Hive-partitioned Parquet (`publish.py`)
      - [x] Crawler infers schemas and registers external tables through Trino (`crawler.py`)
      - [x] Trino access rules: PII masks, column denial, BI role restrictions
  # ---------------- M2
  - title: "Exploratory data analysis and hypothesis tests"
    stage: 4-eda
    milestone: 2
    type: analysis
    status: done
    body: |
      - [x] Static figures (Seaborn/Matplotlib) and interactive explorer (Plotly)
      - [x] Hypotheses H1-H5 tested; drift between periods measured (notebook 04)
  - title: "Preprocessing views and candidate models"
    stage: 5-modelling
    milestone: 2
    type: feature
    status: done
    body: |
      - [x] Linear and tree views fitted on train only
      - [x] Logistic, HistGradientBoosting, XGBoost, LightGBM, Isolation Forest, hybrid; class weights (no SMOTE)
  - title: "Time-series CV tuning and champion selection"
    stage: 5-modelling
    milestone: 2
    type: analysis
    status: done
    body: |
      - [x] Expanding-window CV inside train
      - [x] Simplest non-inferior champion (paired bootstrap, margin 0.01) -> HistGradientBoosting
      - [x] MLflow tracking and model registry
  - title: "Fix train/serve skew (float32 matrices)"
    stage: 5-modelling
    milestone: 2
    type: bug
    status: done
    body: |
      Threshold re-derivation failed verification because the deployed model scored float64 inputs
      while it was trained on float32 matrices.
      - [x] `MATRIX_DTYPE` used in training and serving
      - [x] Parity test: deployed object reproduces training scores exactly
  - title: "Evaluation, uncertainty and business impact"
    stage: 6-evaluation
    milestone: 2
    type: analysis
    status: done
    body: |
      - [x] Test metrics at the validation-chosen threshold; bootstrap CIs; calibration; monthly stability
      - [x] Net benefit, break-even review cost, error analysis, fairness by group (notebook 06)
  - title: "Explainability: SHAP, ELI5, Yellowbrick"
    stage: 6-evaluation
    milestone: 2
    type: analysis
    status: done
    body: |
      - [x] Global and local SHAP; top-3 reasons for every alert
      - [x] ELI5 weights of the baseline; Yellowbrick PR curve of the champion
  # ---------------- M3
  - title: "Scoring API with online feature store"
    stage: 7-deployment
    milestone: 3
    type: feature
    status: done
    body: |
      - [x] FastAPI `/score`, `/score/batch`, `/feedback`, `/metrics`, `/health`
      - [x] Online/batch feature parity check
  - title: "Analyst dashboard (Streamlit)"
    stage: 7-deployment
    milestone: 3
    type: feature
    status: done
    body: |
      - [x] Nine tabs: overview, alert queue with feedback, live scoring, threshold & cost, patterns, monitoring, model, data pipeline, report
      - [x] Self-contained deploy bundle (< 50 MB)
  - title: "ClickHouse OLAP and benchmark against Trino"
    stage: platform
    milestone: 3
    type: infra
    status: done
    body: |
      - [x] Gold loaded through a named collection (read-only account)
      - [x] Same four business questions on both engines; answers compared (`olap.py`)
      - [x] Grafana business dashboard on ClickHouse
  - title: "Superset BI dashboard over Trino"
    stage: platform
    milestone: 3
    type: infra
    status: done
    body: |
      - [x] Superset with the Trino driver; dashboard bootstrapped through the REST API
  - title: "Governance catalog in OpenMetadata"
    stage: platform
    milestone: 3
    type: infra
    status: done
    body: |
      - [x] Compose file and `govern.py` (Trino metadata ingestion, PII tags, lineage)
      - [x] Verified on the CI runner (platform workflow, governance job: 13 tables, 29 PII columns, 9 lineage edges)
  - title: "Monitoring: Evidently drift, Prometheus, Grafana, MLflow"
    stage: 8-monitoring
    milestone: 3
    type: feature
    status: done
    body: |
      - [x] Monthly drift and performance with a retraining policy
      - [x] Prometheus alert rules; Grafana operations dashboard
      - [x] Champion/challenger retraining example (notebook 08)
  - title: "CI/CD: tests, platform end to end, image deploy"
    stage: platform
    milestone: 3
    type: infra
    status: done
    body: |
      - [x] Workflows written (`deploy/github/workflows/`)
      - [x] Installed in `.github/workflows`
      - [x] Platform workflow green on the runner (14/14 smoke checks)
  - title: "Deploy the anomaly detection system"
    stage: 7-deployment
    milestone: 3
    type: infra
    status: in_progress
    body: |
      - [x] Local deployment script with public links (`scripts/deploy/run_local.ps1 -Public`)
      - [x] Application image (`platform/docker/Dockerfile.app`) published by `deploy.yml`
      - [ ] Hosted dashboard on Streamlit Community Cloud
  # ---------------- M4
  - title: "Executed notebooks for all eight lifecycle stages"
    stage: deliverable
    milestone: 4
    type: docs
    status: done
    body: |
      - [x] `notebooks/01-08`, executed on the full data
  - title: "Documentation set"
    stage: deliverable
    milestone: 4
    type: docs
    status: done
    body: |
      - [x] README, problem statement, architecture, data dictionary, model card, user guide, API, platform, deployment, runbook, GitHub Project guide
  - title: "Final report"
    stage: deliverable
    milestone: 4
    type: docs
    status: done
    body: |
      - [x] Report generated from the final results (`scripts/build_report.js` -> `deliverables/`)
  - title: "Final presentation and demo"
    stage: deliverable
    milestone: 4
    type: docs
    status: done
    body: |
      - [x] Slide deck with speaker notes (`scripts/build_deck.js` -> `deliverables/`)
      - [x] Demo script (`docs/demo_script.md`)
  - title: "Merge final-a4 into main and tag the submission"
    stage: deliverable
    milestone: 4
    type: infra
    status: in_progress
    priority: high
    body: |
      - [x] Review and merge pull request #1 from `final-a4`
      - [ ] Merge the platform fixes, tag `v2.0.0`
  - title: "Fix the Docker platform on the CI runner"
    stage: platform
    milestone: 3
    type: bug
    status: done
    body: |
      The platform workflow failed at MinIO set-up; each run then exposed the next problem.
      - [x] `MinioAdmin` needs keyword arguments (minio-py 7.2.20)
      - [x] MLflow server: one worker within its memory limit
      - [x] Trino access rules: allow `sync_partition_metadata` for the pipeline
      - [x] Crawler registers each table independently and reports failures
      - [x] CI steps report errors and results as run annotations
