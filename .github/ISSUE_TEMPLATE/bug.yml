name: Bug report
description: Something produces wrong results or fails
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Command, stage (e.g. `python -m fraudlens.run_all --only verify`), data used
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Logs or the relevant part of a report (e.g. reports/verification_report.json)
      render: text
